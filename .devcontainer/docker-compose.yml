# Dev-only services for the Codespace. Production uses infra/docker-compose.prod.yml.
services:
  app:
    image: mcr.microsoft.com/devcontainers/go:1-1.25-bookworm
    volumes:
      - ../..:/workspaces:cached
    # Keep the container alive; you run the api/web yourself from the terminal.
    command: sleep infinity
    environment:
      DATABASE_URL: postgres://journal:journal@db:5432/journal?sslmode=disable
    depends_on:
      - db

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: journal
      POSTGRES_PASSWORD: journal # dev-only credentials, never used in prod
      POSTGRES_DB: journal
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
