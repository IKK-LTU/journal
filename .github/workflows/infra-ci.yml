name: infra-ci

# Catch mistakes in the deploy files before they reach the server.
on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yml"
      - ".github/workflows/deploy-api.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck deploy.sh
        run: shellcheck deploy.sh

      - name: Compose file is valid
        env:
          IMAGE_TAG: ci
          API_DOMAIN: api.example.test
          POSTGRES_PASSWORD: ci
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Caddyfile is valid
        run: docker run --rm -e API_DOMAIN=api.example.test -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
