name: deploy-api

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "infra/**"
      - ".github/workflows/deploy-api.yml"
  # Rollback: Actions → deploy-api → Run workflow → image tag = an older commit SHA.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (full commit SHA) to deploy. Empty = build this commit."
        required: false

# Never two deploys at the same time; a newer one waits instead of cancelling a running one.
concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push the image to GitHub Container Registry

env:
  IMAGE: ghcr.io/ikk-ltu/journal-api
  API_DOMAIN: api.51-20-125-7.sslip.io

jobs:
  build:
    if: ${{ !inputs.image_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    needs: build
    # Runs after a successful build, or directly for a rollback (build skipped).
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Copy infra files to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "infra/docker-compose.prod.yml,infra/Caddyfile,infra/deploy.sh"
          target: "~/journal-infra"
          strip_components: 1

      - name: Deploy on the server
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG,API_DOMAIN,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: bash ~/journal-infra/deploy.sh

      # The real proof: HTTPS works, Caddy reaches the API, the API reaches Postgres.
      - name: Health check over HTTPS
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "https://${API_DOMAIN}/api/healthz"; then echo; exit 0; fi
            sleep 3
          done
          echo "::error::https://${API_DOMAIN}/api/healthz did not answer OK within 90s"
          exit 1
