name: api-ci

on:
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: api

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A real, throwaway Postgres for the integration tests.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: journal
          POSTGRES_PASSWORD: journal
          POSTGRES_DB: journal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U journal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: go.mod / go.sum are tidy
        run: go mod tidy -diff

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6
          working-directory: api

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://journal:journal@localhost:5432/journal_test?sslmode=disable
        run: go test -race ./...

      - name: Docker build
        run: docker build -t journal-api:ci .
