name: Deploy

# Disabled during the monorepo migration: this script builds from the repo root,
# but the FE now lives in web/. Replaced by the image-based deploy in Phase 3.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/journal
            git pull
            pnpm install
            pnpm build
            cd ~/api
            docker-compose restart nginx