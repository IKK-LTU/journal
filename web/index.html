<!doctype html>
<html lang="lt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Joyful Thoughts</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <script>
      // Apply the saved theme before the first paint, so dark-mode users never see a light flash.
      // Must match MUI's storage key ("mui-mode") and colorSchemeSelector ("class") in theme.ts.
      (function () {
        try {
          var mode = localStorage.getItem("mui-mode") || "system";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = mode === "dark" || (mode === "system" && prefersDark);
          document.documentElement.classList.add(isDark ? "dark" : "light");
        } catch (error) {
          // Storage blocked: MUI falls back to the system setting after it loads.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
